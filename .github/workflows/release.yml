name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.version.outputs.bumped }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Detect version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          new_version=$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

          tmp_dir=$(mktemp -d)
          trap 'rm -rf "$tmp_dir"' EXIT
          if ! git show "$BEFORE_SHA:pyproject.toml" > "$tmp_dir/pyproject.toml"; then
            echo "Unable to read the version before this push; refusing to release" >&2
            exit 1
          fi

          old_version=$(uv run python -c "import tomllib; print(tomllib.load(open('$tmp_dir/pyproject.toml', 'rb'))['project']['version'])")
          bumped=$(uv run --no-project --with packaging python -c \
            'import sys; from packaging.version import Version; print(str(Version(sys.argv[2]) > Version(sys.argv[1])).lower())' \
            "$old_version" "$new_version")
          echo "bumped=$bumped" >> "$GITHUB_OUTPUT"
          echo "Version before push: $old_version; version after push: $new_version; bumped: $bumped"

  release:
    needs: version
    if: needs.version.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Push tag
        run: |
          git fetch --tags
          if git rev-parse "v${{ needs.version.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ needs.version.outputs.version }} already exists"
            exit 0
          fi
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag "v${{ needs.version.outputs.version }}"
          git push origin "v${{ needs.version.outputs.version }}"
      - name: Build
        run: uv build
      - name: Publish to PyPI
        run: uv publish
      - name: Create GitHub release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
